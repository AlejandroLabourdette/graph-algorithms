[project]
name = "graph-algorithms"
version = "0.1.0"
description = "Graph theory algorithms with Graphviz visualizations"
readme = "README.md"
authors = [
    { name = "Alejandro Labourdette", email = "jal.labourdette@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "graphviz>=0.21",
]

[project.scripts]
petri = "graph_algorithms.cli.petri:main"
petri_cover = "graph_algorithms.cli.petri_cover:main"
tarjan = "graph_algorithms.cli.tarjan:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
